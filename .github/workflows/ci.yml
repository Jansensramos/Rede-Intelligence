name: Validação contínua

on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rede_intelligence_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d rede_intelligence_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rede_intelligence_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rede_intelligence_test?schema=public
      REDE_TEST_DATABASE_GUARD: confirmed
      SESSION_SECRET: ci-only-session-secret-not-for-production-2026-000000000000
      INTEGRATION_SECRET_KEY: ci-only-integration-vault-key-for-demo-data-never-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm exec prisma db seed
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint .
      - run: pnpm exec vitest run --configLoader runner
      - run: pnpm build
