name: Deploy readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image (sem publicação)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          tags: rede-intelligence:web-${{ github.sha }}
      - name: Build worker image (sem publicação)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          tags: rede-intelligence:worker-${{ github.sha }}

  release-gate:
    needs: container-audit
    runs-on: ubuntu-latest
    environment: production-approval
    steps:
      - name: Gate documental
        run: echo "Imagem validada. Deploy e prisma migrate deploy exigem ambiente aprovado e permanecem externos a este workflow."
