<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" role="img" aria-labelledby="title desc">
  <title id="title">REDE Intelligence</title>
  <desc id="desc">Marca REDE Intelligence em azul profundo e dourado.</desc>
  <defs>
    <linearGradient id="redeBlue" x1="0" x2="1">
      <stop offset="0" stop-color="#0b3471"/>
      <stop offset="1" stop-color="#082b61"/>
    </linearGradient>
  </defs>

  <!-- Monograma R inspirado na marca oficial fornecida -->
  <g transform="translate(38 34)">
    <path fill="url(#redeBlue)" d="M40 64h154c112 0 184 63 184 154 0 88-69 151-176 151h-76V226h70c53 0 88-29 88-73 0-43-35-72-88-72H126v288H40V64Z"/>
    <rect x="40" y="351" width="112" height="14" fill="#c9921d"/>
