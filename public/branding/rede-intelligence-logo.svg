    <rect x="40" y="405" width="112" height="14" fill="#c9921d"/>
    <rect x="40" y="435" width="74" height="80" fill="url(#redeBlue)"/>
    <path d="M174 351h88l178 164h-94L174 351Z" fill="url(#redeBlue)"/>
  </g>

